<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Vehicle Balance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Poppins',sans-serif;
    background:#1a1f35;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ── Scene wrapper ── */
  .scene {
    position:relative;
    width:700px;
    height:420px;
    background:linear-gradient(135deg,#4a6cf7 0%,#6a4fc7 100%);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 40px 80px rgba(0,0,0,0.5);
  }

  /* ground line */
  .scene::after {
    content:'';
    position:absolute;
    bottom:100px; left:0; right:0;
    height:2px;
    background:rgba(255,255,255,0.08);
  }

  /* ── FORM CARD ── */
  .form-card {
    position:absolute;
    top:50%; right:40px;
    transform:translate(120%, -50%);
    width:320px;
    background:rgba(255,255,255,0.97);
    border-radius:16px;
    padding:28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    transition:transform 0.8s cubic-bezier(.2,.8,.3,1);
    z-index:5;
  }
  .form-card.visible {
    transform:translate(0,-50%);
  }
  .form-title {
    font-size:1.1rem;
    font-weight:700;
    color:#1a1f35;
    margin-bottom:4px;
  }
  .form-sub {
    font-size:0.72rem;
    color:#888;
    margin-bottom:18px;
  }
  .form-label {
    font-size:0.68rem;
    font-weight:600;
    color:#aaa;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:5px;
    display:block;
  }
  .form-input {
    width:100%;
    padding:10px 14px;
    border:1.5px solid #e8e8e8;
    border-radius:8px;
    font-size:0.85rem;
    font-family:'Poppins',sans-serif;
    color:#1a1f35;
    outline:none;
    margin-bottom:12px;
    transition:border-color .2s, box-shadow .2s;
    background:#fafafa;
  }
  .form-input:focus {
    border-color:#4a6cf7;
    box-shadow:0 0 0 3px rgba(74,108,247,0.12);
    background:#fff;
  }
  .form-btn {
    width:100%;
    padding:11px;
    background:linear-gradient(135deg,#FFD700,#FFA500);
    color:#1a1f35;
    font-weight:700;
    font-size:0.88rem;
    font-family:'Poppins',sans-serif;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
    margin-top:4px;
  }
  .form-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,165,0,.4); }
  .result-box {
    margin-top:12px;
    padding:10px 12px;
    background:#f0f5ff;
    border:1px solid #c5d5ff;
    border-radius:8px;
    font-size:0.8rem;
    color:#1a1f35;
    display:none;
  }
  .result-box.show { display:block; }
  .result-box.error { background:#fff0f0; border-color:#ffc5c5; }
  .result-box p { margin-bottom:4px; }
  .result-box p:last-child { margin-bottom:0; }

  /* ── CHARACTER canvas ── */
  #charCanvas {
    position:absolute;
    bottom:0; left:0;
    z-index:10;
    pointer-events:none;
  }

  /* ── Briefcase drop spot ── */
  .briefcase-floor {
    position:absolute;
    bottom:96px;
    left:230px;
    width:38px; height:28px;
    z-index:4;
    opacity:0;
    transition:opacity .3s;
  }
  .briefcase-floor.show { opacity:1; }

  /* shadow */
  .char-shadow {
    position:absolute;
    bottom:97px;
    left:80px;
    width:90px; height:14px;
    background:radial-gradient(ellipse,rgba(0,0,0,0.25),transparent 70%);
    border-radius:50%;
    z-index:3;
    transform:scaleX(0);
    transition:transform .3s;
  }
  .char-shadow.show { transform:scaleX(1); }
</style>
</head>
<body>

<div class="scene" id="scene">

  <!-- Form card -->
  <div class="form-card" id="formCard">
    <div class="form-title">🔍 Check Vehicle Balance</div>
    <div class="form-sub">Enter your details to check balance</div>

    <label class="form-label">Username</label>
    <input class="form-input" type="text" id="username" placeholder="Enter your username">

    <label class="form-label">Vehicle Number</label>
    <input class="form-input" type="text" id="vehicle_number" placeholder="Enter vehicle number">
<button class="form-btn" id="checkBtn" onclick="checkBalance()">
  💰 Check Balance
</button>

<button
  class="form-btn"
  id="rechargeBtn"
  onclick="rechargeBalance()"
  style="
    margin-top:10px;
    background:linear-gradient(135deg,#00c853,#64dd17);
    color:white;
  "
>
  ➕ Recharge Balance
</button>

<div class="result-box" id="resultBox"></div>
  </div>

  <!-- Floor briefcase -->
  <svg class="briefcase-floor" id="briefFloor" viewBox="0 0 38 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="6" width="38" height="22" rx="3" fill="#6B2F0A" stroke="#3a1505" stroke-width="1.5"/>
    <rect x="12" y="0" width="14" height="8" rx="2" fill="none" stroke="#3a1505" stroke-width="2"/>
    <line x1="0" y1="17" x2="38" y2="17" stroke="#3a1505" stroke-width="1.2"/>
    <circle cx="19" cy="17" r="3" fill="#FFD700"/>
  </svg>

  <!-- Shadow -->
  <div class="char-shadow" id="charShadow"></div>

  <!-- Canvas for character -->
  <canvas id="charCanvas" width="250" height="320"></canvas>
</div>

<script>
// ─────────────────────────────────────────────
//  CHARACTER SPRITE SHEET via Canvas 2D
//  Full animation sequence matching the video:
//  1. Walk in from left (with briefcase in hand)
//  2. Reach center, bend down (drop briefcase)
//  3. Stand up, point/gesture
//  4. Form slides in → character stands beside it
// ─────────────────────────────────────────────

const canvas = document.getElementById('charCanvas');
const ctx = canvas.getContext('2d');

const W = 250, H = 320;
let t = 0; // global time tick

// ── State machine ──
// 0 = walk-in   1 = bend-down   2 = stand-up   3 = idle
let phase = 0;
let phaseT = 0;

// Character position
let charX = -60;
let charY = 200; // bottom of torso from top

// Walking legs angle
let legAngle = 0;
let legDir = 1;

const WALK_TARGET = 88; // x where character stops

function easeOut(t) { return 1 - Math.pow(1-t,3); }
function easeInOut(t) { return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function lerp(a,b,t) { return a+(b-a)*t; }

// ── Draw helpers ──

function drawRoundRect(x,y,w,h,r,fill,stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.stroke(); }
}

function drawCharacter(x, y, legA, armA, bendAngle, holdBag) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(bendAngle);

  const skin = '#FDBCB4';
  const hair = '#D4A017';
  const suit = '#9BA8D4';
  const suitDark = '#7A89BB';
  const pants = '#2D2D44';
  const shoe = '#ffffff';
  const tie  = '#FFD700';

  // ── Shadow ──
  ctx.save();
  ctx.translate(0, 95);
  ctx.scale(1, 0.18);
  ctx.beginPath();
  ctx.arc(0, 0, 32, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.fill();
  ctx.restore();

  // ── Legs ──
  ctx.save();
  ctx.translate(0, 42);

  // Left leg
  ctx.save();
  ctx.translate(-10, 0);
  ctx.rotate(legA * 0.9);
  drawRoundRect(-6, 0, 12, 38, 4, pants, null);
  // shoe
  ctx.save(); ctx.translate(0, 38);
  ctx.rotate(-legA*0.3);
  drawRoundRect(-7, 0, 18, 8, 3, shoe, null);
  ctx.restore();
  ctx.restore();

  // Right leg
  ctx.save();
  ctx.translate(10, 0);
  ctx.rotate(-legA * 0.9);
  drawRoundRect(-6, 0, 12, 38, 4, pants, null);
  ctx.save(); ctx.translate(0, 38);
  ctx.rotate(legA*0.3);
  drawRoundRect(-8, 0, 18, 8, 3, shoe, null);
  ctx.restore();
  ctx.restore();

  ctx.restore();

  // ── Torso ──
  drawRoundRect(-18, 0, 36, 46, 6, suit, suitDark);
  // jacket lapels
  ctx.beginPath();
  ctx.moveTo(-6,2); ctx.lineTo(0,18); ctx.lineTo(6,2);
  ctx.fillStyle='#fff'; ctx.fill();
  // tie
  ctx.beginPath();
  ctx.moveTo(-4,18); ctx.lineTo(0,36); ctx.lineTo(4,18); ctx.lineTo(2,12); ctx.lineTo(-2,12);
  ctx.fillStyle=tie; ctx.fill();

  // ── Arms ──
  // Left arm (holds bag if holdBag)
  ctx.save();
  ctx.translate(-18, 6);
  ctx.rotate(holdBag ? 0.4 + armA*0.3 : armA);
  drawRoundRect(-6, 0, 12, 32, 4, suit, null);
  // hand
  ctx.beginPath(); ctx.arc(0, 34, 6, 0, Math.PI*2);
  ctx.fillStyle=skin; ctx.fill();
  if(holdBag) {
    // briefcase held
    ctx.save(); ctx.translate(0, 42);
    drawBriefcase(ctx, -12, -8, 26, 18);
    ctx.restore();
  }
  ctx.restore();

  // Right arm
  ctx.save();
  ctx.translate(18, 6);
  ctx.rotate(-armA);
  drawRoundRect(-6, 0, 12, 32, 4, suit, null);
  ctx.beginPath(); ctx.arc(0, 34, 6, 0, Math.PI*2);
  ctx.fillStyle=skin; ctx.fill();
  ctx.restore();

  // ── Neck ──
  drawRoundRect(-5, -8, 10, 10, 3, skin, null);

  // ── Head ──
  ctx.save();
  ctx.translate(0, -34);
  // face
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 20, 0, 0, Math.PI*2);
  ctx.fillStyle=skin; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1; ctx.stroke();

  // hair
  ctx.beginPath();
  ctx.ellipse(0, -10, 18, 12, 0, Math.PI, 0);
  ctx.fillStyle=hair; ctx.fill();
  // hair top detail
  ctx.beginPath();
  ctx.moveTo(-14,-10); ctx.bezierCurveTo(-8,-22,8,-22,14,-10);
  ctx.fillStyle=hair; ctx.fill();

  // eyes
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.ellipse(-6,0,2.5,3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,0,2.5,3,0,0,Math.PI*2); ctx.fill();
  // eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-5,-1,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-1,1,0,Math.PI*2); ctx.fill();

  // smile
  ctx.beginPath();
  ctx.arc(0, 6, 7, 0.2, Math.PI-0.2);
  ctx.strokeStyle='#c0785a'; ctx.lineWidth=1.8; ctx.stroke();

  // ears
  ctx.beginPath(); ctx.ellipse(-18,2,4,6,0,0,Math.PI*2);
  ctx.fillStyle=skin; ctx.fill();
  ctx.beginPath(); ctx.ellipse(18,2,4,6,0,0,Math.PI*2);
  ctx.fillStyle=skin; ctx.fill();

  ctx.restore();
  ctx.restore();
}

function drawBriefcase(ctx, x, y, w, h) {
  // handle
  ctx.beginPath();
  ctx.moveTo(x+w*.3, y);
  ctx.lineTo(x+w*.3, y-6);
  ctx.lineTo(x+w*.7, y-6);
  ctx.lineTo(x+w*.7, y);
  ctx.strokeStyle='#5c2e0a'; ctx.lineWidth=2.5; ctx.stroke();
  // body
  drawRoundRect(x, y, w, h, 3, '#8B4513', '#5c2e0a');
  // center line
  ctx.beginPath(); ctx.moveTo(x, y+h/2); ctx.lineTo(x+w, y+h/2);
  ctx.strokeStyle='#5c2e0a'; ctx.lineWidth=1; ctx.stroke();
  // latch
  ctx.beginPath(); ctx.arc(x+w/2, y+h/2, 3, 0, Math.PI*2);
  ctx.fillStyle='#FFD700'; ctx.fill();
}

// ── Animation loop ──
let walkCycle = 0;
let lastTime = 0;

function animate(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  ctx.clearRect(0, 0, W, H);

  phaseT += dt;

  if (phase === 0) {
    // WALK IN
    walkCycle += dt * 6;
    legAngle = Math.sin(walkCycle) * 0.45;
    const armSwing = Math.sin(walkCycle) * 0.3;
    const progress = Math.min(phaseT / 2.0, 1);
    charX = lerp(-60, WALK_TARGET, easeOut(progress));

    drawCharacter(charX, charY, legAngle, armSwing, 0, true);

    if (progress >= 1) { phase = 1; phaseT = 0; }

  } else if (phase === 1) {
    // BEND DOWN to drop bag
    const p = Math.min(phaseT / 0.7, 1);
    const bend = easeInOut(p) * 0.55;
    const legA = easeInOut(p) * 0.3;
    drawCharacter(charX, charY + easeInOut(p)*22, legA, 0.2, bend, p < 0.5);

    if (p >= 1) {
      // show floor briefcase
      document.getElementById('briefFloor').classList.add('show');
      document.getElementById('charShadow').classList.add('show');
      phase = 2; phaseT = 0;
    }

  } else if (phase === 2) {
    // STAND BACK UP
    const p = Math.min(phaseT / 0.6, 1);
    const bend = (1-easeInOut(p)) * 0.55;
    const yOff = (1-easeInOut(p)) * 22;
    drawCharacter(charX, charY + yOff, 0, 0, bend, false);

    if (p >= 1) {
      // trigger form slide in
      document.getElementById('formCard').classList.add('visible');
      phase = 3; phaseT = 0;
    }

  } else if (phase === 3) {
    // IDLE — breathe + subtle sway
    const breathe = Math.sin(phaseT * 1.4) * 1.2;
    const sway    = Math.sin(phaseT * 0.7) * 0.025;
    const armIdle = Math.sin(phaseT * 1.2) * 0.08;
    drawCharacter(charX, charY + breathe, 0, armIdle, sway, false);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ── Balance check ──
function checkBalance() {
  const username = document.getElementById("username").value.trim();
  const vehicle  = document.getElementById("vehicle_number").value.trim();
  const btn      = document.getElementById("checkBtn");
  const box      = document.getElementById("resultBox");

  if (!username || !vehicle) {
    box.className = 'result-box show error';
    box.innerHTML = '<p>⚠️ Please fill in both fields.</p>';
    return;
  }

  btn.textContent = '⏳ Checking...';
  btn.style.opacity = '0.7';
  box.className = 'result-box';

  fetch("/check_balance_api", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ username, vehicle_number: vehicle })
  })
  .then(r => r.json())
  .then(data => {
    btn.textContent = '💰 Check Balance';
    btn.style.opacity = '1';
    if (data.error) {
      box.className = 'result-box show error';
      box.innerHTML = `<p>❌ ${data.error}</p>`;
    } else {
      box.className = 'result-box show';
      box.innerHTML = `
        <p><strong>👤 Name:</strong> ${data.name}</p>
        <p><strong>🚗 Vehicle:</strong> ${data.vehicle_number}</p>
        <p><strong>💵 Balance:</strong> ₹${data.balance}</p>
      `;
    }
  })
  .catch(() => {
    btn.textContent = '💰 Check Balance';
    btn.style.opacity = '1';
    box.className = 'result-box show error';
    box.innerHTML = '<p>⚠️ Server error. Please try again.</p>';
  });
}
function rechargeBalance() {

  const vehicle = document
    .getElementById("vehicle_number")
    .value
    .trim();

  const amount = prompt(
    "Enter Recharge Amount"
  );

  const box = document.getElementById(
    "resultBox"
  );

  if (!vehicle || !amount) {

    box.className = 'result-box show error';

    box.innerHTML = `
      <p>⚠️ Enter vehicle number and amount.</p>
    `;

    return;
  }

  fetch("/recharge_balance", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      vehicle_number: vehicle,
      amount: amount
    })

  })

  .then(response => response.json())

  .then(data => {

    if (data.status === "success") {

      box.className = 'result-box show';

      box.innerHTML = `
        <p>✅ Recharge Successful</p>
        <p><strong>🚗 Vehicle:</strong> ${data.vehicle_number}</p>
        <p><strong>💵 New Balance:</strong> ₹${data.new_balance}</p>
      `;

    } else {

      box.className = 'result-box show error';

      box.innerHTML = `
        <p>❌ ${data.message}</p>
      `;
    }

  })

  .catch(error => {

    box.className = 'result-box show error';

    box.innerHTML = `
      <p>⚠️ Server Error</p>
    `;
  });
}
</script>
</body>
</html>
